name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 协议安全机检（ServerMsg 只读承诺）
        run: bash scripts/check-protocol.sh

  test:
    runs-on: ubuntu-latest
    needs: protocol-check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # rust-embed 编译期嵌入 frontend/dist：先构建前端
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - name: 测试
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifacts: zhengtang-agent zhengtang-server
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifacts: zhengtang-agent zhengtang-server
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            artifacts: zhengtang-agent
          - target: x86_64-apple-darwin
            os: macos-latest
            artifacts: zhengtang-agent zhengtang-server
          - target: aarch64-apple-darwin
            os: macos-latest
            artifacts: zhengtang-agent zhengtang-server
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: 安装 musl 交叉工具（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build
      - name: 构建（release + 目标三元组）
        run: |
          for bin in ${{ matrix.artifacts }}; do
            package=$(echo $bin | sed 's/zhengtang-//')
            cargo build --release -p "$package" --target ${{ matrix.target }}
          done
      - name: 打包
        run: |
          mkdir -p dist
          for bin in ${{ matrix.artifacts }}; do
            name="$bin-${{ matrix.target }}"
            mkdir -p "/tmp/pkg/$name"
            cp "target/${{ matrix.target }}/release/$bin" "/tmp/pkg/$name/"
            cp scripts/install.sh /tmp/pkg/ 2>/dev/null || true
            tar -czf "dist/$name.tar.gz" -C /tmp/pkg "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
